services:
  postgres:
    image: postgres:16-alpine
    container_name: ranking-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ranking}
      POSTGRES_USER: ${POSTGRES_USER:-ranking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ranking}
    volumes:
      - ranking-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ranking}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ranking-pgdata:
