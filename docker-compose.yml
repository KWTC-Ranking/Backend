services:
  postgres:
    image: postgres:16-alpine
    container_name: ranking-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ranking
      POSTGRES_USER: ranking
      POSTGRES_PASSWORD: ranking
    volumes:
      - ranking-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ranking-pgdata:
